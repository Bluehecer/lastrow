<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News - Sudheera Stores</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <canvas id="canvas"></canvas>
    <header>
        <h1>Lastrow News</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="news.html" aria-current="page">News</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="news">
            <h2>Latest News</h2>
            <p>Stay updated with our latest news and offers.</p>
        </section>
    </main>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
        let points = [];
        let spread = 0;
        let frame;

        function resizeCanvas() {
            const pixelRatio = Math.min(window.devicePixelRatio || 1, 1.5);
            canvas.width = window.innerWidth * pixelRatio;
            canvas.height = window.innerHeight * pixelRatio;
            ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
            draw();
        }

        canvas.addEventListener('click', (e) => {
            const x = e.clientX;
            const y = e.clientY;
            if (points.length === 40) points.shift();
            points.push({ x, y });
            spread = 0;
            draw();
        });

        function connectPoints() {
            for (let i = 0; i < points.length; i++) {
                for (let j = i + 1; j < points.length; j++) {
                    ctx.beginPath();
                    ctx.moveTo(points[i].x + Math.sin(spread + i) * 50, points[i].y + Math.cos(spread + i) * 50);
                    ctx.lineTo(points[j].x + Math.sin(spread + j) * 50, points[j].y + Math.cos(spread + j) * 50);
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            connectPoints();
        }

        function animate() {
            draw();
            if (!reducedMotion.matches && !document.hidden) {
                spread += 0.005;
                frame = requestAnimationFrame(animate);
            }
        }

        function updateMotion() {
            cancelAnimationFrame(frame);
            animate();
        }

        window.addEventListener('resize', () => {
            resizeCanvas();
        });
        document.addEventListener('visibilitychange', updateMotion);
        reducedMotion.addEventListener('change', updateMotion);
        resizeCanvas();
        animate();
    </script>
      <footer>
        <p>© 2024 Lastrow News</p>
    </footer>
</body>
</html>
